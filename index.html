<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Where Winds Meet – Play Free Now</title>
  <link rel="preload" as="image" href="bg-official-steam.jpg">
  <style>
    :root {
      --gold: #e2bd6a;
      --ink: #07090c;
      --jade: #6fe0c4;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0b1016;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      color: #fff;
    }

    /* The whole page is the link: any click goes to the offer */
    .page-link {
      position: fixed;
      inset: 0;
      display: block;
      color: inherit;
      text-decoration: none;
      cursor: pointer;
    }

    /* Stage keeps the screenshot's 2000x1051 ratio and covers the viewport,
       so the hotspot stays glued to the Windows button at every size. */
    .stage {
      position: absolute;
      left: 50%;
      top: 50%;
      width: max(100vw, calc(100svh * 2000 / 1049));
      aspect-ratio: 2000 / 1049;
      transform: translate(-50%, -50%);
      container-type: inline-size;
      background: url("bg-official-steam.jpg") center / 100% 100% no-repeat;
    }

    /* Windows button hotspot + spotlight (huge shadow dims everything else) */
    .win {
      position: absolute;
      left: 32.6%;
      top: 61.39%;
      width: 17.45%;
      height: 8.48%;
      border-radius: 0.3cqw;
      box-shadow: 0 0 0 200vmax rgba(4, 7, 11, 0.45);
      animation: dim-in 0.9s ease-out both;
    }

    .win::before {
      content: "";
      position: absolute;
      inset: -0.35cqw;
      border: 0.22cqw solid var(--gold);
      border-radius: 0.6cqw;
      box-shadow: 0 0 1.4cqw rgba(226, 189, 106, 0.85), inset 0 0 1cqw rgba(226, 189, 106, 0.4);
      animation: ring 1.4s ease-in-out infinite;
    }

    .win::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 0.3cqw;
      background: linear-gradient(100deg, transparent 30%, rgba(255, 255, 255, 0.45) 45%, transparent 60%) -120% 0 / 220% 100% no-repeat;
      animation: shine 2.4s ease-in-out infinite;
    }

    .ribbon {
      position: absolute;
      right: -0.8cqw;
      top: -1.5cqw;
      padding: 0.3cqw 0.7cqw;
      background: #d8483a;
      border: 0.12cqw solid #fff;
      border-radius: 0.4cqw;
      font-size: 0.78cqw;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
      transform: rotate(4deg);
      box-shadow: 0 0.3cqw 0.8cqw rgba(0, 0, 0, 0.5);
      animation: bob 1.2s ease-in-out infinite;
    }

    .logo {
      position: fixed;
      z-index: 3;
      left: 2.5vw;
      top: 3.5vh;
      width: clamp(140px, 14vw, 300px);
      filter: drop-shadow(0 0.5cqw 1cqw rgba(0, 0, 0, 0.7));
    }

    /* Attractive message glued under the Steam button */
    .msg {
      position: absolute;
      left: 41.33%;
      top: 72.5%;
      width: 27cqw;
      transform: translateX(-50%);
      padding: 1cqw 1.3cqw 1.1cqw;
      text-align: center;
      background: rgba(10, 14, 20, 0.9);
      border: 0.12cqw solid rgba(226, 189, 106, 0.85);
      border-radius: 0.7cqw;
      box-shadow: 0 1cqw 2.5cqw rgba(0, 0, 0, 0.6);
      animation: pop 0.5s 0.6s cubic-bezier(.2, 1.4, .4, 1) both;
    }

    .msg::before {
      content: "";
      position: absolute;
      left: 50%;
      top: -0.7cqw;
      width: 1.3cqw;
      height: 1.3cqw;
      margin-left: -0.65cqw;
      background: rgba(10, 14, 20, 0.9);
      border-left: 0.12cqw solid rgba(226, 189, 106, 0.85);
      border-top: 0.12cqw solid rgba(226, 189, 106, 0.85);
      transform: rotate(45deg);
    }

    .msg strong {
      display: block;
      font-family: Cinzel, "Trajan Pro", Georgia, serif;
      font-size: 1.7cqw;
      line-height: 1.1;
      color: var(--gold);
      text-transform: uppercase;
    }

    .msg span {
      display: block;
      margin-top: 0.45cqw;
      font-size: 0.98cqw;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.9);
    }

    .msg span b { color: var(--jade); }

    /* Pointing hand */
    .hand {
      position: absolute;
      left: 46.5%;
      top: 67.5%;
      font-size: 3.2cqw;
      filter: drop-shadow(0 0.3cqw 0.4cqw rgba(0, 0, 0, 0.7));
      animation: tap 1.2s ease-in-out infinite;
      transform-origin: 20% 10%;
    }

    @keyframes dim-in {
      from { box-shadow: 0 0 0 200vmax rgba(4, 7, 11, 0); }
    }

    @keyframes ring {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.04); opacity: 0.65; }
    }

    @keyframes shine {
      0%, 50% { background-position: -120% 0; }
      100% { background-position: 220% 0; }
    }

    @keyframes bob {
      0%, 100% { transform: rotate(4deg) translateY(0); }
      50% { transform: rotate(4deg) translateY(-0.3cqw); }
    }

    @keyframes pop {
      from { opacity: 0; transform: translateX(-50%) translateY(1cqw) scale(0.9); }
    }

    @keyframes tap {
      0%, 100% { transform: translate(0, 0) rotate(-20deg); }
      50% { transform: translate(-0.8cqw, -1cqw) rotate(-20deg) scale(0.92); }
    }

    /* Portrait: zoom on the Steam button, logo on top, message under it */
    @media (orientation: portrait) {
      body::before {
        content: "";
        position: fixed;
        inset: -40px;
        background: url("bg-official-steam.jpg") 60% center / cover no-repeat;
        filter: blur(18px) brightness(0.45);
      }
      .stage {
        width: 230vw;
        left: calc(50vw - 230vw * 0.4133);
        top: calc(52svh - 230vw * 0.5245 * 0.656);
        transform: none;
      }
      .logo { left: 50%; top: 4svh; width: 46vw; transform: translateX(-50%); }
      .msg { width: 88vw; padding: 4vw 4.5vw; border-width: 2px; border-radius: 3vw; }
      .msg::before { width: 4vw; height: 4vw; top: -2vw; margin-left: -2vw; border-width: 2px; }
      .msg strong { font-size: 6.4vw; }
      .msg span { font-size: 3.9vw; margin-top: 1.8vw; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }
  </style>
</head>
<body>
  <a class="page-link" id="cta" href="https://to.gamingres.com/5C7F/2J1J9/" aria-label="Play Where Winds Meet free now">
    <img class="logo" src="logo.png" alt="Where Winds Meet">
    <div class="stage">
      <div class="win"><span class="ribbon">🎁 Free rewards</span></div>
      <div class="hand" aria-hidden="true">👆</div>
      <div class="msg">
        <strong>▶ Play Free Now</strong>
        <span>Start your journey today and <b>unlock your starter rewards</b> 🎁</span>
      </div>
    </div>
  </a>

  <script>
    // Forward the lander's query string (Propeller macros: sub1=${SUBID}&sub2=${ZONEID}...) to the offer link.
    const cta = document.getElementById("cta");
    if (window.location.search) {
      cta.href = cta.href + window.location.search;
    }
  </script>
</body>
</html>
